version: "3.9"
services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
      - "4571:4571"
    environment:
      - SERVICES=s3,dynamodb,secretsmanager,lambda
      - DEBUG=1
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./.localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  backend:
    build:
      context: ./backend
    container_name: resume-backend
    environment:
      - ENV=${ENV:-local}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET=ai-resume-cv-bucket
      - S3_CV_PREFIX=${S3_CV_PREFIX:-rawcvs/}
      - S3_RESUME_PREFIX=${S3_RESUME_PREFIX:-processedresumes/}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://localstack:4566}
      - TRACE_TABLE=CvBuilderDb
      - SECRETS_MANAGER_NAME=${SECRETS_MANAGER_NAME:-CvBuilderSecretsManager}
      - LLM_PROVIDER=${LLM_PROVIDER:-hf_endpoint}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - HF_API_TOKEN=${HF_API_TOKEN:-}
      - HF_MODEL=${HF_MODEL:-Qwen/Qwen2.5-14B-Instruct-1M}
    depends_on:
      - localstack
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: resume-frontend
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET=ai-resume-cv-bucket
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://localstack:4566}
    depends_on:
      - backend
    ports:
      - "8501:8501"
